[package]
name = "stardust-uring"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
default-run = "stardust-uring"

[features]
# Link StardustDB's static archive (libstardust_full.a): one executable with the
# engine inside, and no library files to ship.
default = ["static"]
static = ["stardust/static"]

[dependencies]
stardust = { path = "../third_party/stardust/abi/bindings/rust", default-features = false, features = ["serde"] }
libc = "=0.2.183"
httparse = "=1.10.1"
memchr = "=2.8.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["raw_value"] }
itoa = "=1.0.18"
base64 = "=0.22.1"
sha2 = "=0.10.9"
hmac = "=0.12.1"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "=0.7.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
